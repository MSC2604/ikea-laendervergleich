name: IKEA product API connectivity check

on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - .github/workflows/ikea-api-check.yml
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check exact IKEA article search in DE, CZ and PL
        run: |
          node --input-type=module <<'NODE'
          const markets = [
            ["de", "de", "EUR"],
            ["cz", "cs", "CZK"],
            ["pl", "pl", "PLN"]
          ];
          const article = "70556067";
          let failed = false;

          for (const [country, language, currency] of markets) {
            const url = new URL(`https://sik.search.blue.cdtapps.com/${country}/${language}/search-result-page`);
            url.search = new URLSearchParams({ q: article, size: "100", types: "PRODUCT" });
            try {
              const response = await fetch(url, {
                headers: {
                  "Accept": "application/json",
                  "Origin": "https://msc2604.github.io"
                },
                signal: AbortSignal.timeout(20000)
              });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const cors = response.headers.get("access-control-allow-origin") || "";
              if (!(cors === "*" || cors.includes("msc2604.github.io"))) {
                throw new Error(`CORS header missing or unsuitable: ${cors || "(none)"}`);
              }
              const data = await response.json();
              const items = data?.searchResultPage?.products?.main?.items;
              if (!Array.isArray(items)) throw new Error("Unexpected IKEA search response");
              const entry = items.find(item => {
                const p = item?.product ?? item;
                return [p?.itemNo, p?.itemNoGlobal].some(value => String(value ?? "").replace(/\\D/g, "") === article);
              });
              if (!entry) throw new Error(`Exact article ${article} not found`);
              const product = entry.product ?? entry;
              const price = Number(product?.salesPrice?.numeral);
              if (!(Number.isFinite(price) && price > 0)) throw new Error("No valid local price");
              if (!product?.pipUrl) throw new Error("Product URL missing");
              console.log(JSON.stringify({
                market: country,
                exactArticleFound: true,
                articleNumber: product.itemNo ?? null,
                globalArticleNumber: product.itemNoGlobal ?? null,
                currency,
                localPrice: price,
                cors: cors
              }));
            } catch (error) {
              failed = true;
              console.error(JSON.stringify({ market: country, error: String(error) }));
            }
          }

          try {
            const response = await fetch("https://api.frankfurter.dev/v2/rates?base=EUR&quotes=CZK,PLN", {
              signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const rows = Array.isArray(data) ? data : [];
            const rates = Object.fromEntries(rows.map(row => [String(row.quote || "").toUpperCase(), Number(row.rate)]));
            if (!(rates.CZK > 0 && Number.isFinite(rates.CZK) && rates.PLN > 0 && Number.isFinite(rates.PLN))) {
              throw new Error("CZK or PLN rate missing/invalid");
            }
            console.log(JSON.stringify({ exchangeRates: "OK", date: rows[0]?.date ?? null, CZK: rates.CZK, PLN: rates.PLN }));
          } catch (error) {
            failed = true;
            console.error(JSON.stringify({ exchangeRates: "FAILED", error: String(error) }));
          }

          if (failed) process.exitCode = 1;
          NODE
